name: Deploy production to REG.RU

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: reg-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      REG_HOST: ${{ secrets.REG_HOST }}
      REG_PORT: ${{ secrets.REG_PORT }}
      REG_USER: ${{ secrets.REG_USER }}
      REG_DEPLOY_PATH: ${{ secrets.REG_DEPLOY_PATH }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare clean static export
        run: |
          rm -rf .next out
          printf '{"sha":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > public/deploy-version.json

      - name: Build static site
        run: pnpm build
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_TEMPLATE_GIT_REF: ${{ github.sha }}

      - name: Validate static export
        run: |
          test -f out/deploy-version.json
          grep -Fq "$GITHUB_SHA" out/deploy-version.json
          test -f out/template-previews/reports-marketing-campaign-analysis/slide-02.webp
          grep -RFq "slide-02.webp" out/templates/reports-marketing-campaign-analysis/

      - name: Validate destination
        run: |
          if [ -z "$REG_HOST" ] || [ -z "$REG_USER" ] || [ -z "$REG_DEPLOY_PATH" ]; then
            echo "REG.RU deployment secrets are incomplete"
            exit 1
          fi
          if [ "$REG_DEPLOY_PATH" = "/" ] || [ "$REG_DEPLOY_PATH" = "." ]; then
            echo "Unsafe REG_DEPLOY_PATH"
            exit 1
          fi

      - name: Configure SSH
        env:
          REG_SSH_KEY: ${{ secrets.REG_SSH_KEY }}
        run: |
          if [ -z "$REG_SSH_KEY" ]; then
            echo "REG_SSH_KEY is missing"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$REG_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${REG_PORT:-22}" "$REG_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to REG.RU
        run: |
          rsync -az --delete --checksum \
            -e "ssh -p ${REG_PORT:-22}" \
            out/ "$REG_USER@$REG_HOST:$REG_DEPLOY_PATH/"

      - name: Verify public deployment
        run: |
          version_url="https://www.ilkhim.ru/deploy-version.json?sha=$GITHUB_SHA"
          asset_url="https://www.ilkhim.ru/template-previews/reports-marketing-campaign-analysis/slide-02.webp?sha=$GITHUB_SHA"

          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$version_url" | grep -Fq "$GITHUB_SHA" && \
               curl --fail --silent --show-error --head "$asset_url" >/dev/null; then
              echo "Production serves commit $GITHUB_SHA"
              exit 0
            fi
            echo "Production is not updated yet (attempt $attempt/6)"
            sleep 10
          done

          echo "REG.RU deploy completed, but www.ilkhim.ru does not serve commit $GITHUB_SHA"
          echo "Check that REG_DEPLOY_PATH points to the document root used by www.ilkhim.ru"
          exit 1
