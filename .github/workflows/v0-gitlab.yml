name: Send v0 changes to GitLab
on:
  push:
    branches: ['v0/**']
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Existing v0/* branch to send to GitLab'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: v0-gitlab-${{ github.event.pull_request.head.ref || inputs.branch || github.ref_name }}
  cancel-in-progress: false
jobs:
  merge_request:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'v0/') &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always execute the bridge from trusted main, never from a PR checkout.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Create or update GitLab merge request
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GITLAB_BRIDGE_TOKEN: ${{ secrets.GITLAB_BRIDGE_TOKEN }}
        run: python3 scripts/v0_gitlab_bridge.py
