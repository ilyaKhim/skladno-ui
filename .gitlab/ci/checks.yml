frontend_check:
  stage: test
  image: node:22-bookworm
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store/]
  before_script:
    - npm install --global pnpm@10.10.0
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm typecheck
    - pnpm test:frontend
    # Main is built by deploy_reg; branches/MRs also validate the static export.
    - if [ "$CI_COMMIT_BRANCH" != main ]; then STATIC_EXPORT=1 pnpm build; fi
  rules:
    - changes: [frontend/**/*, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .gitlab/**/*, .gitlab-ci.yml]

backend_check:
  stage: test
  image: eclipse-temurin:26-jdk
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: godeck_test
    POSTGRES_USER: godeck
    POSTGRES_PASSWORD: godeck-ci-only
    TEST_DATABASE_URL: 'jdbc:postgresql://postgres:5432/godeck_test?currentSchema=auth_test'
    DATABASE_USER: godeck
    DATABASE_PASSWORD: godeck-ci-only
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key: java26-maven
    paths: [.m2/repository/]
  script:
    - cd backend
    - ./mvnw --batch-mode verify
    - ./mvnw --batch-mode -f ../document-worker/pom.xml verify
  artifacts:
    when: always
    reports:
      junit: [backend/target/surefire-reports/TEST-*.xml, document-worker/target/surefire-reports/TEST-*.xml]
  rules:
    - changes: [backend/**/*, document-worker/**/*, compose.yaml, scripts/backend-dev.sh, scripts/document-worker.sh, .gitlab/**/*, .gitlab-ci.yml]

bridge_check:
  stage: test
  image: python:3.13-alpine
  script:
    - python3 -m unittest discover -s scripts -p 'test_v0_gitlab_bridge.py'
  rules:
    - changes: [scripts/v0_gitlab_bridge.py, scripts/test_v0_gitlab_bridge.py, .github/**/*, .gitlab/**/*, .gitlab-ci.yml]

editor_e2e:
  stage: test
  # Keep this version aligned with @playwright/test in pnpm-lock.yaml.
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: godeck_test
    POSTGRES_USER: godeck
    POSTGRES_PASSWORD: godeck-ci-only
    E2E_DATABASE_URL: 'postgresql://godeck:godeck-ci-only@postgres:5432/godeck_test'
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key: editor-e2e
    paths: [.pnpm-store/, .m2/repository/]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates fontconfig fonts-dejavu-core
    - mkdir -p .local/jdk
    - curl --fail --location --retry 3 'https://api.adoptium.net/v3/binary/latest/26/ga/linux/x64/jdk/hotspot/normal/eclipse' | tar xz --strip-components=1 -C .local/jdk
    - export JAVA_HOME="$CI_PROJECT_DIR/.local/jdk"
    - export PATH="$JAVA_HOME/bin:$PATH"
    - npm install --global pnpm@10.10.0
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm exec playwright install chromium webkit
  script:
    - pnpm test:e2e:types
    - pnpm test:migrations
    - pnpm test:e2e
  artifacts:
    when: always
    expire_in: 7 days
    paths: [playwright-report/, test-results/]
    reports:
      junit: test-results/e2e.xml
  rules:
    - changes: [frontend/**/*, backend/**/*, document-worker/**/*, e2e/**/*, playwright.config.ts, scripts/e2e.mjs, scripts/backend-dev.sh, scripts/document-worker.sh, scripts/test-draft-migration.mjs, package.json, pnpm-lock.yaml, .gitlab/**/*, .gitlab-ci.yml]
