server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8081}
  servlet:
    session:
      timeout: 7d
      cookie:
        name: GODECK_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
spring:
  config:
    import:
      - "optional:file:./backend/.env.local[.properties]"
      - "optional:file:./.env.local[.properties]"
  application:
    name: godeck-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/godeck}
    username: ${DATABASE_USER:godeck}
    password: ${DATABASE_PASSWORD:godeck-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      accept-float-as-int: false
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
godeck:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:GoDeck <noreply@godeck.local>}
  auth:
    dev-bypass: ${AUTH_BYPASS:false}
  generation:
    enabled: ${GODECK_OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-6.1-sol}
    data-dir: ${GODECK_DATA_DIR:./data/presentations}
