name: godeck-local
services:
  document-worker:
    profiles: ['documents']
    build:
      context: .
      dockerfile: document-worker/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/godeck
      DATABASE_USER: godeck
      DATABASE_PASSWORD: godeck-local-only
      DOCUMENT_WORKER_POLL_MS: ${DOCUMENT_WORKER_POLL_MS:-500}
      DOCUMENT_WORKER_RETRY_MS: ${DOCUMENT_WORKER_RETRY_MS:-1000}
      DOCUMENT_WORKER_CONNECT_TIMEOUT_SECONDS: ${DOCUMENT_WORKER_CONNECT_TIMEOUT_SECONDS:-5}
      DOCUMENT_WORKER_SOCKET_TIMEOUT_SECONDS: ${DOCUMENT_WORKER_SOCKET_TIMEOUT_SECONDS:-5}
      DOCUMENT_WORKER_JOB_TIMEOUT_SECONDS: ${DOCUMENT_WORKER_JOB_TIMEOUT_SECONDS:-5}
      DOCUMENT_WORKER_CLAIM_LEASE_SECONDS: ${DOCUMENT_WORKER_CLAIM_LEASE_SECONDS:-10}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: godeck
      POSTGRES_USER: godeck
      POSTGRES_PASSWORD: godeck-local-only
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U godeck -d godeck']
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
volumes:
  postgres-data:
